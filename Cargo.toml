[package]
name = "hashman"
version = "1.0.0"
edition = "2021"
description = "Generate and validate SHA-256 manifests for folders"
license = "MIT OR Apache-2.0"

[dependencies]
sha2 = "0.11.1"
rayon = "1.12.0"
walkdir = "2.5.1"
egui = { version = "0.37.0", optional = true }
eframe = { version = "0.37.0", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.18.0", optional = true }

[target.'cfg(not(target_os = "linux"))'.dependencies]
egui-file-dialog = { version = "0.16.0", optional = true }

[features]
default = ["gui"]
gui = ["dep:egui", "dep:egui-file-dialog", "dep:eframe", "dep:rfd"]

[[bin]]
name = "hashman"
path = "src/main.rs"
required-features = ["gui"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Headless UI testing.
[dev-dependencies]
egui_kittest = "0.37.0"
tempfile = "3.27.0"