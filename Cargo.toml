[package]
name = "hashman"
version = "1.0.0"
edition = "2021"
description = "Generate and validate SHA-256 manifests for folders"

[dependencies]
egui = "0.37.0"
egui-file-dialog = "0.16.0"
sha2 = "0.11.1"
rayon = "1.12.0"
walkdir = "2.5.1"
eframe = { version = "0.37.0", optional = true }
rfd = { version = "0.18.0", optional = true, default-features = false, features = ["xdg-portal", "async-std"] }

[features]
default = ["gui"]
gui = ["eframe", "rfd"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Headless UI testing.
[dev-dependencies]
egui_kittest = "0.37"
