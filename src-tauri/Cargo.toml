[package]
name = "hashman"
version = "1.0.0"
description = "Generate and validate SHA-256 manifests for folders"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rayon = "1"
walkdir = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
