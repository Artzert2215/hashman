<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hashman</title>
<style>
  :root {
    --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f; --muted: #6e6e73;
    --line: #e2e2e7; --accent: #2563eb; --accent-text: #ffffff;
    --ok: #15803d; --ok-bg: #dcfce7; --bad: #b91c1c; --bad-bg: #fee2e2;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --card: #000000; --text: #f5f5f7; --muted: #9a9aa0;
      --line: #3a3a3e; --accent: #3b82f6; --accent-text: #ffffff;
      --ok: #86efac; --ok-bg: #14532d; --bad: #fca5a5; --bad-bg: #7f1d1d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  main { max-width: 520px; margin: 0 auto; display: grid; gap: 16px; }
  h1 { font-size: 20px; margin: 0; }
  p.sub { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button {
    font: inherit; font-weight: 600; padding: 14px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button:hover:not(:disabled) { filter: brightness(1.06); }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); }
  select { font: inherit; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  .path { font-size: 13px; color: var(--muted); word-break: break-all; margin-bottom: 10px; }
  progress { width: 100%; height: 10px; accent-color: var(--accent); }
  .stats { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: 6px; }
  .banner { padding: 10px 12px; border-radius: 8px; font-weight: 600; margin-bottom: 10px; }
  .banner.ok { background: var(--ok-bg); color: var(--ok); }
  .banner.bad { background: var(--bad-bg); color: var(--bad); }
  .counts { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  details { margin-top: 8px; }
  summary { cursor: pointer; font-weight: 600; }
  ul { margin: 6px 0 0; padding-left: 18px; max-height: 180px; overflow: auto; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; word-break: break-all; }
  .hidden { display: none; }
  .hint { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <section class="card">
    <div class="actions">
      <button id="btn-gen">Generate</button>
      <button id="btn-val">Validate</button>
    </div>
    <div class="row" style="margin-top:12px">
      <label for="workers">Files hashed in parallel</label>
      <select id="workers">
        <option value="1">1 (HDD)</option>
        <option value="2">2</option>
        <option value="4" selected>4 (default)</option>
        <option value="8">8 (NVME SSD)</option>
      </select>
    </div>
    <p class="hint" style="margin:10px 0 0">The manifest exists as <code>MANIFEST.sha256</code> inside the folder.</p>
  </section>

  <section id="progress-card" class="card hidden">
    <div id="path" class="path"></div>
    <progress id="bar" value="0" max="1"></progress>
    <div class="stats"><span id="amount"></span><span id="speed"></span></div>
  </section>

  <section id="result-card" class="card hidden">
    <div id="banner" class="banner"></div>
    <div id="counts" class="counts"></div>
    <div id="lists"></div>
  </section>
</main>

<script>
  const { invoke } = window.__TAURI__.core;
  const { open } = window.__TAURI__.dialog;
  const { listen } = window.__TAURI__.event;

  const $ = (id) => document.getElementById(id);
  const MAX_LIST = 500;
  const gb = (n) => (n / 1e9).toFixed(n >= 1e10 ? 1 : 2) + " GB";

  function setBusy(busy) {
    $("btn-gen").disabled = busy;
    $("btn-val").disabled = busy;
    $("workers").disabled = busy;
  }

  function banner(text, ok) {
    const b = $("banner");
    b.textContent = text;
    b.className = "banner " + (ok ? "ok" : "bad");
  }

  function addList(title, items) {
    if (!items.length) return;
    const d = document.createElement("details");
    d.open = true;
    const s = document.createElement("summary");
    s.textContent = `${title} (${items.length})`;
    d.appendChild(s);
    const ul = document.createElement("ul");
    for (const name of items.slice(0, MAX_LIST)) {
      const li = document.createElement("li");
      li.textContent = name; // textContent: file names are never treated as HTML
      ul.appendChild(li);
    }
    if (items.length > MAX_LIST) {
      const li = document.createElement("li");
      li.textContent = `…and ${items.length - MAX_LIST} more`;
      ul.appendChild(li);
    }
    d.appendChild(ul);
    $("lists").appendChild(d);
  }

  function render(r) {
    $("lists").textContent = "";
    if (r.mode === "generate") {
      const ok = r.unreadable.length === 0;
      banner(ok ? "Manifest created" : "Manifest created, but some files could not be read", ok);
      $("counts").textContent = `${r.files - r.unreadable.length} files hashed. Saved as MANIFEST.sha256 in the folder.`;
      addList("Could not read", r.unreadable);
    } else {
      const ok = !r.bad.length && !r.missing.length && !r.unreadable.length;
      banner(ok ? "All files match the manifest" : "Problems found", ok);
      $("counts").textContent =
        `Checked ${r.checked} files. Changed/corrupt: ${r.bad.length}. Missing: ${r.missing.length}. ` +
        `Unreadable: ${r.unreadable.length}. Extra (not in manifest): ${r.extra.length}.`;
      addList("Changed or corrupt", r.bad);
      addList("Missing", r.missing);
      addList("Could not read", r.unreadable);
      addList("Extra files (not in manifest)", r.extra);
    }
    $("result-card").classList.remove("hidden");
  }

  async function run(mode) {
    const folder = await open({
      directory: true,
      multiple: false,
      title: mode === "generate" ? "Select the folder to hash" : "Select the folder to validate",
    });
    if (!folder) return;

    setBusy(true);
    $("result-card").classList.add("hidden");
    $("path").textContent = folder;
    $("bar").value = 0;
    $("amount").textContent = "Scanning…";
    $("speed").textContent = "";
    $("progress-card").classList.remove("hidden");

    const t0 = performance.now();
    const unlisten = await listen("progress", (e) => {
      const { done, total } = e.payload;
      $("bar").max = Math.max(total, 1);
      $("bar").value = done;
      $("amount").textContent = `${gb(done)} / ${gb(total)}`;
      const secs = (performance.now() - t0) / 1000;
      if (secs > 1 && done > 0) $("speed").textContent = `${Math.round(done / 1e6 / secs)} MB/s`;
    });

    try {
      const res = await invoke("run_job", {
        mode, folder, workers: parseInt($("workers").value, 10),
      });
      render(res);
    } catch (err) {
      $("lists").textContent = "";
      banner(String(err), false);
      $("counts").textContent = "";
      $("result-card").classList.remove("hidden");
    } finally {
      unlisten();
      $("progress-card").classList.add("hidden");
      setBusy(false);
    }
  }

  $("btn-gen").addEventListener("click", () => run("generate"));
  $("btn-val").addEventListener("click", () => run("validate"));
</script>
</body>
</html>
