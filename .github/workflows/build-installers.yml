name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Headless tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --no-default-features

  build:
    name: Build ${{ matrix.platform }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-26.04
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Determine package version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Create dist directory
        shell: bash
        run: mkdir -p dist

      # Linux -----------------------------------------------------------------
      - name: Install Linux build and packaging dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libgtk-3-dev libxkbcommon-dev libx11-dev libxext-dev \
            libxrender-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev \
            libegl1-mesa-dev libgl1-mesa-dev libvulkan-dev \
            patchelf imagemagick flatpak flatpak-builder

      - name: Build Linux binary
        if: matrix.platform == 'linux'
        run: cargo build --release --features gui

      - name: Package AppImage
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp target/release/hashman AppDir/usr/bin/hashman
          convert assets/app-icon.png -resize 256x256 AppDir/usr/share/icons/hicolor/256x256/apps/hashman.png
          cat > AppDir/usr/share/applications/hashman.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Hashman
          Comment=Generate and validate SHA-256 folder manifests
          Exec=hashman
          Icon=hashman
          Categories=Utility;FileTools;
          Terminal=false
          DESKTOP

          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy.AppImage
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool.AppImage
          chmod +x linuxdeploy.AppImage appimagetool.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ./linuxdeploy.AppImage \
            --appdir AppDir \
            --executable target/release/hashman \
            --desktop-file AppDir/usr/share/applications/hashman.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/hashman.png
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool.AppImage AppDir dist/Hashman-x86_64.AppImage
          chmod +x dist/Hashman-x86_64.AppImage

      - name: Package Flatpak bundle
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p flatpak-source
          cp target/release/hashman flatpak-source/hashman
          convert assets/app-icon.png -resize 256x256 flatpak-source/hashman.png
          cat > flatpak-source/org.artzert.Hashman.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Hashman
          Comment=Generate and validate SHA-256 folder manifests
          Exec=hashman
          Icon=org.artzert.Hashman
          Categories=Utility;FileTools;
          Terminal=false
          DESKTOP
          cat > flatpak-source/org.artzert.Hashman.metainfo.xml <<'META'
          <?xml version="1.0" encoding="UTF-8"?>
          <component type="desktop-application">
            <id>org.artzert.Hashman</id>
            <name>Hashman</name>
            <summary>Generate and validate SHA-256 folder manifests</summary>
            <metadata_license>CC0-1.0</metadata_license>
            <project_license>LicenseRef-proprietary</project_license>
            <description><p>Generate and validate SHA-256 manifests for folders.</p></description>
            <launchable type="desktop-id">org.artzert.Hashman.desktop</launchable>
          </component>
          META
          cat > org.artzert.Hashman.yml <<'MANIFEST'
          app-id: org.artzert.Hashman
          runtime: org.freedesktop.Platform
          runtime-version: '26.08'
          sdk: org.freedesktop.Sdk
          command: hashman
          finish-args:
            - --share=ipc
            - --socket=x11
            - --socket=wayland
            - --device=dri
          modules:
            - name: hashman
              buildsystem: simple
              build-commands:
                - install -Dm755 hashman /app/bin/hashman
                - install -Dm644 org.artzert.Hashman.desktop /app/share/applications/org.artzert.Hashman.desktop
                - install -Dm644 org.artzert.Hashman.metainfo.xml /app/share/metainfo/org.artzert.Hashman.metainfo.xml
                - install -Dm644 hashman.png /app/share/icons/hicolor/256x256/apps/org.artzert.Hashman.png
              sources:
                - type: dir
                  path: flatpak-source
          MANIFEST
          sudo flatpak remote-add --if-not-exists --system flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --system --noninteractive -y flathub org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08
          flatpak-builder --force-clean --repo=.flatpak-builder/repo  flatpak-build org.artzert.Hashman.yml
          flatpak build-update-repo --generate-static-deltas .flatpak-builder/repo
          flatpak build-bundle .flatpak-builder/repo  dist/Hashman.flatpak org.artzert.Hashman stable

      # macOS -----------------------------------------------------------------
      - name: Build macOS universal binaries
        if: matrix.platform == 'macos'
        run: |
          cargo build --release --features gui --target x86_64-apple-darwin
          cargo build --release --features gui --target aarch64-apple-darwin

      - name: Package macOS app and DMG
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
        run: |
          set -euo pipefail
          APP=Hashman.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" Hashman.iconset
          lipo -create \
            target/x86_64-apple-darwin/release/hashman \
            target/aarch64-apple-darwin/release/hashman \
            -output "$APP/Contents/MacOS/Hashman"
          chmod +x "$APP/Contents/MacOS/Hashman"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" assets/app-icon.png --out "Hashman.iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z "$double" "$double" assets/app-icon.png --out "Hashman.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns Hashman.iconset -o "$APP/Contents/Resources/Hashman.icns"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>Hashman</string>
            <key>CFBundleIdentifier</key><string>org.artzert.Hashman</string>
            <key>CFBundleName</key><string>Hashman</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleIconFile</key><string>Hashman</string>
            <key>CFBundleVersion</key><string>$APP_VERSION</string>
            <key>CFBundleShortVersionString</key><string>$APP_VERSION</string>
            <key>LSMinimumSystemVersion</key><string>10.15</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          if [[ -n "${CODESIGN_IDENTITY:-}" ]]; then
            codesign --force --deep --options runtime --sign "$CODESIGN_IDENTITY" "$APP"
          fi
          hdiutil create -volname Hashman -srcfolder "$APP" -ov -format UDZO dist/Hashman.dmg

      # Windows ----------------------------------------------------------------
      - name: Build Windows binary
        if: matrix.platform == 'windows'
        run: cargo build --release --features gui --target x86_64-pc-windows-msvc

      - name: Package MSI and EXE installer
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = 'target\x86_64-pc-windows-msvc\release'
          New-Item -ItemType Directory -Force -Path windows-stage | Out-Null
          Copy-Item "$bin\hashman.exe" windows-stage\
          Get-ChildItem "$bin\*.dll" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName windows-stage\
          }
          choco install imagemagick --yes --no-progress
          magick assets/app-icon.png -define icon:auto-resize=256,128,64,48,32,16 assets\hashman.ico

          dotnet tool install --global wix
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          @'
          <Wix xmlns="http://wixtoolset.org/schemas/v4/wxs">
            <Package Name="Hashman" Manufacturer="Hashman" Version="$(var.Version)"
                     UpgradeCode="B56F9F9C-2B9A-4BA5-A8BD-1E0A78D2A104" Scope="perMachine">
              <MajorUpgrade DowngradeErrorMessage="A newer version of Hashman is already installed." />
              <MediaTemplate />
              <Icon Id="HashmanIcon" SourceFile="assets\hashman.ico" />
              <Property Id="ARPPRODUCTICON" Value="HashmanIcon" />
              <Feature Id="Main" Title="Hashman" Level="1">
                <Files Include="$(var.PublishDir)\**" Directory="INSTALLFOLDER" />
              </Feature>
            </Package>
            <Fragment>
              <StandardDirectory Id="ProgramFiles64Folder">
                <Directory Id="INSTALLFOLDER" Name="Hashman" />
              </StandardDirectory>
            </Fragment>
          </Wix>
          '@ | Set-Content -Encoding utf8 Package.wxs
          wix build Package.wxs -arch x64 -d "Version=$env:APP_VERSION" `
            -d "PublishDir=$((Resolve-Path windows-stage).Path)" -o dist\Hashman.msi

          choco install innosetup --yes --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          @'
          #define AppName "Hashman"
          #define AppVersion GetEnv("APP_VERSION")
          [Setup]
          AppId={{8E5C8F49-9A1D-4A2B-9F72-4D8A1E6B5C10}
          AppName={#AppName}
          AppVersion={#AppVersion}
          AppPublisher=Artzert
          DefaultDirName={autopf}\Hashman
          DefaultGroupName=Hashman
          OutputDir=dist
          OutputBaseFilename=Hashman-Setup
          SetupIconFile=assets\hashman.ico
          UninstallDisplayIcon={app}\hashman.exe
          ArchitecturesInstallIn64BitMode=x64
          PrivilegesRequired=admin
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          [Files]
          Source: "windows-stage\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs
          [Icons]
          Name: "{group}\Hashman"; Filename: "{app}\hashman.exe"
          Name: "{autodesktop}\Hashman"; Filename: "{app}\hashman.exe"; Tasks: desktopicon
          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional icons:"
          '@ | Set-Content -Encoding utf8 installer.iss
          & $iscc installer.iss

      - name: List generated packages
        shell: bash
        run: ls -lh dist/

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v7
        with:
          name: hashman-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish draft release
    needs: [test, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hashman-*
          merge-multiple: true
          path: dist
      - name: Verify release assets
        run: |
          set -euo pipefail
          ls -lh dist/
          test -f dist/Hashman-x86_64.AppImage
          test -f dist/Hashman.flatpak
          test -f dist/Hashman.dmg
          test -f dist/Hashman.msi
          test -f dist/Hashman-Setup.exe
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
