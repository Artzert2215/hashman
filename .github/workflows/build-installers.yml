name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.v.outputs.value }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            # Fail the release if the tag, Cargo.toml, Cargo.lock and metainfo disagree.
            bash packaging/scripts/check-version.sh "$GITHUB_REF_NAME"
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: [ci, version]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-latest
    env:
      APP_VERSION: ${{ needs.version.outputs.value }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          targets: ${{ matrix.platform == 'macos' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Create dist directory
        shell: bash
        run: mkdir -p dist

      # Linux -----------------------------------------------------------------
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxkbcommon-dev libx11-dev \
            libxcb1-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev

      - name: Build Linux binary
        if: matrix.platform == 'linux'
        run: cargo build --locked --release --features gui

      - name: Package AppImage
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          # TODO: pin these two downloads to a release tag + sha256 instead of "continuous".
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy.AppImage
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool.AppImage
          chmod +x linuxdeploy.AppImage appimagetool.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ./linuxdeploy.AppImage \
            --appdir AppDir \
            --executable target/release/hashman \
            --desktop-file packaging/linux/org.artzert.Hashman.desktop \
            --icon-file packaging/linux/org.artzert.Hashman.png
          install -Dm644 packaging/linux/org.artzert.Hashman.metainfo.xml \
            AppDir/usr/share/metainfo/org.artzert.Hashman.metainfo.xml
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool.AppImage AppDir dist/Hashman-x86_64.AppImage
          chmod +x dist/Hashman-x86_64.AppImage

      - name: Build Flatpak bundle
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists --system flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --system --noninteractive -y flathub \
            org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08 \
            org.freedesktop.Sdk.Extension.rust-stable//26.08
          bash packaging/scripts/flatpak-prepare.sh
          flatpak-builder --force-clean --repo=.flatpak-builder/repo flatpak-build \
            packaging/flatpak/org.artzert.Hashman.yml
          flatpak build-bundle .flatpak-builder/repo dist/Hashman.flatpak org.artzert.Hashman

      # macOS -----------------------------------------------------------------
      - name: Build macOS universal binaries
        if: matrix.platform == 'macos'
        run: |
          cargo build --locked --release --features gui --target x86_64-apple-darwin
          cargo build --locked --release --features gui --target aarch64-apple-darwin

      - name: Package macOS app and DMG
        if: matrix.platform == 'macos'
        shell: bash
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
        run: |
          set -euo pipefail
          APP=Hashman.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" Hashman.iconset
          lipo -create \
            target/x86_64-apple-darwin/release/hashman \
            target/aarch64-apple-darwin/release/hashman \
            -output "$APP/Contents/MacOS/Hashman"
          chmod +x "$APP/Contents/MacOS/Hashman"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" assets/app-icon.png --out "Hashman.iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z "$double" "$double" assets/app-icon.png --out "Hashman.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns Hashman.iconset -o "$APP/Contents/Resources/Hashman.icns"
          sed "s/@VERSION@/$APP_VERSION/g" packaging/macos/Info.plist.in > "$APP/Contents/Info.plist"
          if [[ -n "${CODESIGN_IDENTITY:-}" ]]; then
            codesign --force --deep --options runtime --sign "$CODESIGN_IDENTITY" "$APP"
          fi
          hdiutil create -volname Hashman -srcfolder "$APP" -ov -format UDZO dist/Hashman.dmg

      # Windows ----------------------------------------------------------------
      - name: Build Windows binary
        if: matrix.platform == 'windows'
        run: cargo build --locked --release --features gui --target x86_64-pc-windows-msvc

      - name: Package MSI and EXE installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Get-Location).Path
          $bin = "$root\target\x86_64-pc-windows-msvc\release"
          $stage = "$root\windows-stage"
          $icon = "$root\assets\hashman.ico"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "$bin\hashman.exe" $stage
          Get-ChildItem "$bin\*.dll" -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName $stage }

          dotnet tool install --global wix
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          wix build packaging\windows\Package.wxs -arch x64 -d "Version=$env:APP_VERSION" `
            -d "PublishDir=$stage" -d "IconFile=$icon" -o dist\Hashman.msi
          if ($LASTEXITCODE -ne 0) { throw "wix failed" }

          choco install innosetup --yes --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DStageDir=$stage" "/DIconFile=$icon" "/DOutDir=$root\dist" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: List generated packages
        shell: bash
        run: ls -lh dist/

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v7
        with:
          name: hashman-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish draft release
    needs: [ci, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: hashman-*
          merge-multiple: true
          path: dist
      - name: Verify release assets and write checksums
        run: |
          set -euo pipefail
          ls -lh dist/
          for f in Hashman-x86_64.AppImage Hashman.flatpak Hashman.dmg Hashman.msi Hashman-Setup.exe; do
            test -f "dist/$f"
          done
          cd dist && sha256sum Hashman* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
