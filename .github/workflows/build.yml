name: Build installers

# Builds the windowed egui/eframe app into a native bundle per platform and
# publishes it to a GitHub Release on `v*` tag.
#
#   macOS   -> Hashman.dmg (universal x86_64 + arm64)
#   Linux   -> hashman-linux.tar.gz (binary + non-core shared libs)
#   Windows -> hashman-windows.zip (hashman.exe + any DLLs)
#
# Each build job uploads one artifact; a final `release` job publishes them all
# in a single call so the jobs can't race to create the release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Headless test suite (hashing unit tests + egui_kittest UI render).
  test:
    name: test (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - run: cargo test --no-default-features

  build:
    name: ${{ matrix.os_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_name: linux
            artifact: hashman-linux.tar.gz
          - os: macos-latest
            os_name: macos
            artifact: Hashman.dmg
          - os: windows-latest
            os_name: windows
            artifact: hashman-windows.zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Two macOS targets so we can lipo a universal binary.
          targets: ${{ matrix.os_name == 'macos' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Linux system libraries
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxkbcommon-dev libx11-dev \
            librsvg2-dev libwebp-dev libxext-dev libxrender-dev \
            xorg-dev patchelf

      # --- Builds ------------------------------------------------------------------
      - name: Build (Linux)
        if: matrix.os_name == 'linux'
        run: cargo build --features gui --release

      - name: Build (macOS)
        if: matrix.os_name == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --features gui --release --target x86_64-apple-darwin
          cargo build --features gui --release --target aarch64-apple-darwin

      - name: Build (Windows)
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: cargo build --features gui --release --target x86_64-pc-windows-msvc

      # --- macOS: universal binary -> .app -> .dmg ---------------------------------
      - name: Package macOS .app
        if: matrix.os_name == 'macos'
        shell: bash
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
        run: |
          set -euo pipefail
          APP=Hashman.app
          mkdir -p "$APP/Contents/MacOS"
          lipo -create \
            target/x86_64-apple-darwin/release/hashman \
            target/aarch64-apple-darwin/release/hashman \
            -output "$APP/Contents/MacOS/Hashman"
          chmod +x "$APP/Contents/MacOS/Hashman"
          cat > "$APP/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0">
            <dict>
              <key>CFBundleExecutable</key><string>Hashman</string>
              <key>CFBundleIdentifier</key><string>com.hashman.app</string>
              <key>CFBundleName</key><string>Hashman</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleVersion</key><string>1.0.0</string>
              <key>CFBundleShortVersionString</key><string>1.0.0</string>
              <key>LSMinimumSystemVersion</key><string>10.15</string>
              <key>NSHighResolutionCapable</key><true/>
            </dict>
          </plist>
          EOF
          # Sign only when an identity is available; unsigned is fine to inspect.
          if [ -n "${CODESIGN_IDENTITY:-}" ]; then
            codesign --force --deep --sign "$CODESIGN_IDENTITY" "$APP"
          fi
          echo "built $APP"

      - name: Package macOS .dmg
        if: matrix.os_name == 'macos'
        run: |
          hdiutil create -volname Hashman -srcfolder Hashman.app -ov -format UDZO Hashman.dmg

      # --- Linux: binary + shared libs (excluding core system libs) ---------------
      - name: Package Linux bundle
        if: matrix.os_name == 'linux'
        run: |
          set -euo pipefail
          STAGE=hashman-linux
          mkdir -p "$STAGE/bin" "$STAGE/lib"
          cp target/release/hashman "$STAGE/bin/"

          # Copy needed shared libs, but never libc/loader/etc: bundling those
          # breaks the binary on other distros.
          while read -r lib; do
            [ -f "$lib" ] || continue
            cp "$lib" "$STAGE/lib/"
          done < <(ldd target/release/hashman | awk '/=> \//{print $3}' \
                   | grep -Ev '/(libc|libm|libdl|libpthread|librt|libgcc_s|ld-linux[^/]*)\.so' | sort -u)

          # $ORIGIN is resolved by the runtime loader relative to the binary.
          patchelf --set-rpath '$ORIGIN/../lib' "$STAGE/bin/hashman"

          tar -czf hashman-linux.tar.gz "$STAGE"
          ls -lh hashman-linux.tar.gz

      # --- Windows: exe (+ any DLLs) in a zip --------------------------------------
      - name: Package Windows bundle
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          $b = "target\x86_64-pc-windows-msvc\release"
          New-Item -ItemType Directory -Force -Path "hashman-windows" | Out-Null
          Copy-Item "$b\hashman.exe" "hashman-windows\"
          Get-ChildItem "$b\*.dll" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName "hashman-windows\"
          }
          Compress-Archive -Path "hashman-windows" -DestinationPath "hashman-windows.zip"
          Remove-Item -Recurse "hashman-windows"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hashman-${{ matrix.os_name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  # Publish once, after every platform has built.
  release:
    name: publish release
    needs: [test, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hashman-*
          merge-multiple: true
          path: dist

      - run: ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*