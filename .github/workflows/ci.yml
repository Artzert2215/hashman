name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:        # also invoked by build-installers.yml before releasing

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  headless:
    name: fmt, clippy, tests (no GUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
      - run: cargo test --locked --no-default-features

  gui-check:
    name: GUI feature builds (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libx11-dev libxcb1-dev \
            libwayland-dev libegl1-mesa-dev libgl1-mesa-dev
      - run: cargo clippy --locked --features gui --all-targets -- -D warnings
      - run: cargo test --locked --features gui

  packaging-lint:
    name: Validate packaging metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y appstream desktop-file-utils
      - run: appstreamcli validate --no-net packaging/linux/io.github.Artzert2215.Hashman.metainfo.xml
      - run: desktop-file-validate packaging/linux/io.github.Artzert2215.Hashman.desktop
      - run: bash packaging/scripts/check-version.sh
